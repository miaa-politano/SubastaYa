spring.application.name=microservice-java
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/subastaya_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:outbox-schema.sql
subastaya.realtime.base-url=http://localhost:5273
subastaya.realtime.events-path=/api/internal/auctions/notify-event
subastaya.realtime.internal-api-key=${INTERNAL_API_KEY}
subastaya.realtime.connect-timeout-ms=2000
subastaya.realtime.request-timeout-ms=3000
subastaya.outbox.poll-delay-ms=5000
subastaya.outbox.max-attempts=5
