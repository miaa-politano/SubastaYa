spring.application.name=microservice-java

spring.datasource.url=jdbc:postgresql://localhost:5432/subastaya_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
subastaya.realtime.base-url=http://localhost:7073
subastaya.realtime.events-path=/api/internal/auctions/notify-event
subastaya.realtime.internal-api-key=${INTERNAL_API_KEY:INTERNAL_API_KEY}
subastaya.realtime.connect-timeout-ms=2000
subastaya.realtime.request-timeout-ms=3000