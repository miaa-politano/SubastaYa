spring.application.name=microservice-java

spring.datasource.url=jdbc:postgresql://${SUBASTAYA_DB_HOST:localhost}:${SUBASTAYA_DB_PORT:5432}/${SUBASTAYA_DB_NAME:subastaya_db}
spring.datasource.username=subastaya_java
spring.datasource.password=${SUBASTAYA_JAVA_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false
