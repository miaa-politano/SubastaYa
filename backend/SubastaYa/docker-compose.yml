services:
  postgres:
    image: postgres:16-alpine
    container_name: subastaya_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${SUBASTAYA_DB_NAME}
      SUBASTAYA_JAVA_PASSWORD: ${SUBASTAYA_JAVA_PASSWORD}
      SUBASTAYA_DOTNET_PASSWORD: ${SUBASTAYA_DOTNET_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
