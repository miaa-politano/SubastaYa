services:
  postgres:
    image: postgres:16-alpine
    container_name: subastaya_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REDACTED_POSTGRES_ADMIN_PASSWORD
      POSTGRES_DB: subastaya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
